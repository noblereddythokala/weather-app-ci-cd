name: Weather App CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate HTML
        run: echo "Checking HTML structure..." && test -f index.html

      - name: Validate JS
        run: node -v && echo "JavaScript file exists" && test -f script.js

      - name: Validate CSS
        run: test -f style.css

      - name: Lint check (basic simulation)
        run: echo "No lint errors found"

      - name: Build complete
        run: echo "CI pipeline successful 🚀"